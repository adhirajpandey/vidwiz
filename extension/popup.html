<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VidWiz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="" class="logo">
    <span class="brand">VidWiz</span>
    <a href="#" id="open-app" class="header-link">Open VidWiz</a>
  </header>

  <section id="login-view" class="view hidden">
    <h1 class="title">Log in to capture moments</h1>
    <p id="login-reason" class="muted">The extension uses your VidWiz login from the web app.</p>
    <button id="login" class="primary">Log in to VidWiz</button>
  </section>

  <section id="idle-view" class="view hidden">
    <h1 class="title">Open a YouTube video</h1>
    <p class="muted">Then press <kbd id="shortcut">Alt+S</kbd> or use this popup to capture the moment.</p>
  </section>

  <section id="capture-view" class="view hidden">
    <p id="video-title" class="video-title"></p>
    <form id="capture-form" class="capture">
      <textarea id="note" rows="2" placeholder="Note (optional)" aria-label="Note"></textarea>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="ai"> AI line · 1 credit</label>
        <button type="submit" id="capture" class="primary">Capture <span id="capture-time"></span></button>
      </div>
    </form>
    <p id="feedback" class="feedback" role="status"></p>
    <div class="moments-head">
      <span class="muted">Moments in this video</span>
      <a href="#" id="open-video" class="header-link">Open in VidWiz</a>
    </div>
    <ul id="moments" class="moments"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
