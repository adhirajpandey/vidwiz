<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/public/vidwiz.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidWiz — remember what you watch</title>
    <meta
      name="description"
      content="Capture moments while you watch YouTube, find them again by searching what was said, and ask questions across everything you have watched."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://vidwiz.online/" />
    <meta property="og:title" content="VidWiz — remember what you watch" />
    <meta
      property="og:description"
      content="Capture moments while you watch YouTube, find them again by searching what was said, and ask questions across everything you have watched."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vidwiz.online/" />
    <meta property="og:site_name" content="VidWiz" />
    <meta property="og:image" content="https://vidwiz.online/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Geist for UI text, Geist Mono for times -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
