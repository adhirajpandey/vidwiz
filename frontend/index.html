      name="description"

    <link rel="canonical" href="https://vidwiz.online/" />
    <meta property="og:title" content="VidWiz · Keep the moments worth coming back to" />
    <meta
      property="og:description"
      content="Capture moments while you watch YouTube, find them again by searching what was said, and ask questions across everything you have watched."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vidwiz.online/" />
    <meta property="og:site_name" content="VidWiz" />
    <meta property="og:image" content="https://vidwiz.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VidWiz. Tap once. Find it later." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VidWiz · Keep the moments worth coming back to" />
    <meta name="twitter:description" content="Capture moments while you watch YouTube, find them again, and ask questions across your library." />
    <meta name="twitter:image" content="https://vidwiz.online/og-image.png" />
    <meta name="twitter:image:alt" content="VidWiz. Tap once. Find it later." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1B1D3A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Bricolage Grotesque for UI text and headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
