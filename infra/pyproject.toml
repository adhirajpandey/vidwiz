[project]
name = "vidwiz-infra"
version = "0.1.0"
description = "Production AWS CDK infrastructure for VidWiz"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-cdk-lib==2.262.0",
    "aws-cdk.aws-lambda-python-alpha==2.262.0a0",
    "constructs==10.7.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.2",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "skip"
disable_error_code = ["misc"]
files = ["app.py", "vidwiz_infra", "tests"]

[[tool.mypy.overrides]]
module = [
    "aws_cdk",
    "aws_cdk.*",
    "constructs",
    "pydantic",
    "pydantic.*",
    "pydantic_settings",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidwiz_infra"]
