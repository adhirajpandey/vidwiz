name: deploy lambda functions

on:
  push:
    branches:
      - main
    paths:
      - 'backend/workers/lambdas/tasks-dispatcher.py'
      - 'backend/workers/lambdas/ai-summary.py'
      - 'backend/workers/lambdas/ai-note.py'
      - 'backend/workers/lambdas/requirements/**'
      - 'backend/scripts/deploy_lambda.sh'
      - '.github/workflows/deploy-lambdas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Lambda functions
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          deploy_all=false
          deploy_dispatcher=false
          deploy_summary=false
          deploy_note=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] || \
             [[ "${BEFORE_SHA}" =~ ^0+$ ]] || \
             ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            deploy_all=true
          else
            while IFS= read -r changed_file; do
              case "${changed_file}" in
                backend/workers/lambdas/tasks-dispatcher.py)
                  deploy_dispatcher=true
                  ;;
                backend/workers/lambdas/ai-summary.py)
                  deploy_summary=true
                  ;;
                backend/workers/lambdas/ai-note.py)
                  deploy_note=true
                  ;;
                backend/workers/lambdas/requirements/dispatcher.in|backend/workers/lambdas/requirements/dispatcher.txt)
                  deploy_dispatcher=true
                  ;;
                backend/workers/lambdas/requirements/ai.in|backend/workers/lambdas/requirements/ai.txt)
                  deploy_summary=true
                  deploy_note=true
                  ;;
                backend/scripts/deploy_lambda.sh|.github/workflows/deploy-lambdas.yml)
                  deploy_all=true
                  ;;
              esac
            done < <(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
          fi

          if [[ "${deploy_all}" == "true" ]]; then
            deploy_dispatcher=true
            deploy_summary=true
            deploy_note=true
          fi

          entries=()
          if [[ "${deploy_dispatcher}" == "true" ]]; then
            entries+=('{"source_file":"workers/lambdas/tasks-dispatcher.py","function_name":"trigger_on_s3_upload","build_name":"trigger","requirements_file":"workers/lambdas/requirements/dispatcher.txt"}')
          fi
          if [[ "${deploy_summary}" == "true" ]]; then
            entries+=('{"source_file":"workers/lambdas/ai-summary.py","function_name":"vidwiz-summary","build_name":"summary","requirements_file":"workers/lambdas/requirements/ai.txt"}')
          fi
          if [[ "${deploy_note}" == "true" ]]; then
            entries+=('{"source_file":"workers/lambdas/ai-note.py","function_name":"vidwiz-gen-ai-note","build_name":"note","requirements_file":"workers/lambdas/requirements/ai.txt"}')
          fi

          matrix_entries="$(IFS=,; echo "${entries[*]}")"
          echo "matrix={\"include\":[${matrix_entries}]}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    concurrency:
      group: deploy-lambda-${{ matrix.function_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/${{ matrix.requirements_file }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy ${{ matrix.function_name }}
        working-directory: backend
        shell: bash
        run: |
          bash scripts/deploy_lambda.sh \
            "${{ matrix.source_file }}" \
            "${{ matrix.function_name }}" \
            "${{ matrix.build_name }}" \
            "${{ matrix.requirements_file }}"
