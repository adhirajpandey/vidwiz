name: Deploy Production AWS Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Validate and Deploy Production Infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: vidwiz-prod-aws
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: infra/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Validate CDK Infrastructure
        run: uv run --locked python scripts/validate.py

      - name: Prepare Production Deployment Configuration
        env:
          PRODUCTION_DEPLOYMENT_ENV: ${{ secrets.PRODUCTION_DEPLOYMENT_ENV }}
        run: uv run --locked python scripts/prepare_production_config.py

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          role-session-name: vidwiz-${{ github.run_id }}
          aws-region: ${{ env.VIDWIZ_PRODUCTION_AWS_REGION }}
          allowed-account-ids: ${{ env.VIDWIZ_PRODUCTION_AWS_ACCOUNT_ID }}

      - name: Deploy vidwiz-stack to Production
        run: npm exec -- cdk deploy vidwiz-stack --require-approval never

      - name: Remove Temporary Deployment Configuration
        if: always()
        env:
          CONFIG_FILE: ${{ env.VIDWIZ_PRODUCTION_CONFIG_PATH }}
        run: uv run --locked python scripts/prepare_production_config.py --cleanup
