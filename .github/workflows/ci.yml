name: Validate Application and Infrastructure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue every run in order. Change detection compares each push with the one
  # before it, so a skipped run could leave a backend change unpublished.
  queue: max
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changed Paths
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the previous push
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Manual runs and unknown push bases treat every file as changed.
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=$(git ls-files)
          fi
          # Lambda workers ship through CDK, not the backend image.
          image_files=$(grep -E '^(backend/|\.dockerignore$)' <<< "$changed" | grep -vE '^backend/workers/lambdas/' || true)
          if [ -n "$image_files" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Backend Formatting
        run: uv run --locked ruff format --check src workers

      - name: Lint Backend
        run: uv run --locked ruff check src workers

      - name: Run Backend Tests
        run: uv run --locked pytest

  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm lint

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

  infrastructure:
    name: Validate AWS Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: infra/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Validate CDK Infrastructure
        run: uv run --locked python scripts/validate.py

  publish-backend:
    name: Publish Backend Container
    needs: [changes, backend]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: adhirajpandey
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            adhirajpandey/vidwiz:latest
            adhirajpandey/vidwiz:sha-${{ github.sha }}
